plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.minimal.launcher'

    defaultConfig {
        applicationId "com.minimal.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies — pure Android SDK only
}
